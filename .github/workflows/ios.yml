name: iOS (TestFlight)

# Compila, firma y sube la app de iOS a TestFlight. ios/ no se versiona: se
# genera aquí con `cap add ios`, igual que android/ en los otros workflows.
#
# Secrets: APPLE_TEAM_ID, APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD,
#          KEYCHAIN_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY.
# Requisito manual (una vez): la app debe existir en App Store Connect con el
# Bundle ID de abajo; si no, la subida falla. Guía en docs/RELEASING-IOS.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Subir a TestFlight'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.sesolibre.sesolibregames
  PROFILE_NAME: SesoLibre Games App Store

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nada se publica si fallan el lint o los tests.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Añadir plataforma iOS (se genera en CI, no se versiona)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Íconos y pantalla de arranque (desde assets/)
        run: npx @capacitor/assets generate --ios

      - name: Configurar proyecto (versión, firma, privacidad, Info.plist)
        run: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          VERSION=$(node -p "require('./package.json').version")
          ./scripts/ios-configure.sh "$VERSION" "${{ github.run_number }}" \
            "${{ secrets.APPLE_TEAM_ID }}" "$PROFILE_NAME"

      - name: Importar certificado Apple Distribution (keychain temporal)
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          P12="$RUNNER_TEMP/dist.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" \
            || { echo "::error::El .p12 no contiene una identidad Apple Distribution válida"; exit 1; }

      - name: Llave de la API de App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Perfil de aprovisionamiento App Store (por API)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/asc-profile.py "$BUNDLE_ID" "$PROFILE_NAME"

      - name: Compilar y archivar (Release)
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          status=0
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive > "$LOG" 2>&1 || status=$?
          grep -E '(error:|\*\* ARCHIVE)' "$LOG" | head -40 || true
          if [ "$status" -ne 0 ]; then tail -120 "$LOG"; exit "$status"; fi

      - name: Exportar .ipa firmado
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: sesolibre-games-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Subir a TestFlight
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Limpiar keychain y llave
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/firma.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
